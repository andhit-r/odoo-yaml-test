name: CI

on:
  push:
    branches: [master, "1*.0"]
  pull_request:
    branches: [master, "1*.0"]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run pre-commit
        run: pre-commit run --all-files

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Follows requires-python (>=3.10). Odoo 19 needs 3.10+
        # (odoo/release.py: MIN_PY_VERSION = (3, 10)), so 3.8/3.9 are not
        # installable on this branch — pip refuses before a test can run.
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run pytest
        run: pytest

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  integration:
    runs-on: ubuntu-22.04
    container: ghcr.io/oca/oca-ci/py3.10-odoo19.0:latest
    name: integration (Odoo 19.0)
    services:
      postgres:
        # Odoo 19 requires PostgreSQL >= 13; the 9.6 used on master would fail.
        image: postgres:15
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: odoo
        ports:
          - 5432:5432
    env:
      PGHOST: postgres
      PGUSER: odoo
      PGPASSWORD: odoo
      PGDATABASE: probe_test
      ADDONS_DIR: tests_integration/addons
    steps:
      - uses: actions/checkout@v4
      - name: Install the library under test
        run: pip install -e .
      - name: Install addons and dependencies
        run: oca_install_addons
      - name: Initialize test db (installs base and other deps, no tests)
        run: oca_init_test_database
      - name: Upgrade coverage so it can read this repo's pyproject.toml
        run: pip install -U "coverage[toml]"
      - name: Run the probe against a real Odoo 14 registry
        run: oca_run_tests
